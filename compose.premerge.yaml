# Services for `make premerge`. Images match .github/workflows/ci.yml.
# The pgvector job's database and broker, with no named volumes.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: modelanvil
      POSTGRES_USER: modelanvil
      POSTGRES_PASSWORD: modelanvil
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelanvil -d modelanvil"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-alpine
    ports:
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
